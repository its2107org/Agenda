name: Register Stays identifiers (temporary)
on:
  push:
    branches: ["claude/project-thread-9e0f4q"]
    paths: [".github/workflows/stays-register.yml"]
jobs:
  reg:
    runs-on: macos-26
    env:
      TEAMID: ${{ secrets.TEAMID }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - run: bundle install
      - name: Register
        run: |
          cat > /tmp/reg.rb <<'RUBY'
          require "spaceship"
          t = ENV["TEAMID"]
          Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(key_id: ENV["FASTLANE_KEY_ID"], issuer_id: ENV["FASTLANE_ISSUER_ID"], key: ENV["FASTLANE_KEY"])
          { "com.#{t}.stays" => "Stays", "com.#{t}.stays.Widget" => "Stays Widget" }.each do |id, name|
            b = Spaceship::ConnectAPI::BundleId.find(id) || Spaceship::ConnectAPI::BundleId.create(name: name, identifier: id, platform: "IOS")
            puts "::notice::Identifier ready: #{name}"
          end
          begin
            r = Spaceship::ConnectAPI.client.get("v1/users", { limit: 5 }) rescue nil
            puts "::notice::Users readable: #{!r.nil?}"
          rescue => e
            puts "::notice::Users error #{e.message[0,150]}"
          end
          RUBY
          bundle exec ruby /tmp/reg.rb
